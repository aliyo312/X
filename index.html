<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتاق چت اختصاصی من</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <h2>به اتاق چت من خوش آمدید!</h2>
        <div class="chat-box" id="chatBox">
            <div class="message system">سیستم: به چت‌روم خوش آمدید!</div>
        </div>
        <div class="input-area">
            <input type="text" id="username" placeholder="نام شما..." style="width: 30%;">
            <input type="text" id="messageInput" placeholder="پیام..." style="width: 55%;">
            <button onclick="sendMessage()" style="width: 15%;">ارسال</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
